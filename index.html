<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CDR01</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#ecf2f5;background:#0b1118;--bg:#0b1118;--card:#17212c;--line:#344452;--muted:#9aabb7;--accent:#a6e8b0;--danger:#ed6b77}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);min-width:0}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #455767;color:#edf4f7;background:#293947;border-radius:11px;padding:9px 13px;font-weight:600;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}button:active:not(:disabled){filter:brightness(1.16)}button.primary{background:var(--accent);color:#14251a;border-color:var(--accent)}button.danger{background:#a22d3b;color:white;border-color:#d25162}button.ghost{background:transparent}button.selected{background:#294638;border-color:var(--accent);color:var(--accent)}
.appbar{position:sticky;top:0;z-index:20;background:rgba(11,17,24,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}.shell{max-width:1120px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.app-title{font-size:20px;font-weight:750;letter-spacing:.02em;margin:0;white-space:nowrap}.top-right{display:flex;align-items:center;gap:9px}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:40px;border:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;min-height:34px}.dot{height:8px;width:8px;border-radius:50%;background:#778a96}.online .dot{background:var(--accent)}.online{color:var(--accent);border-color:#477759}
main{padding:14px max(14px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}section{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;min-width:0}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:14px}.layout section{min-width:0}h2{font-size:15px;font-weight:700;margin:0 0 13px;letter-spacing:.02em}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.device-list{display:grid;gap:10px;margin-top:12px}.device{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;background:#101a24;border:1px solid var(--line);border-radius:12px;padding:11px}.device-title{font-size:14px;font-weight:650;overflow-wrap:anywhere}
.device-id{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:7px;min-width:0;font-size:11px;color:var(--muted)}
.device-id code{overflow-wrap:anywhere;word-break:break-all;font-family:ui-monospace,Consolas,monospace;color:#c9dce8}
.device-id button{font-size:11px;min-height:30px;padding:3px 9px}
.device-identity{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;border-top:1px solid var(--line);padding-top:10px}
.device-identity label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.device-identity input{width:100%;min-height:40px;background:#223441;border:1px solid #455767;border-radius:8px;color:#edf4f7;padding:7px 9px;font-size:13px;min-width:0}
@media(max-width:390px){.device-identity{grid-template-columns:1fr}}.minor{font-size:12px;margin-top:4px;color:var(--muted)}.orient{display:flex;flex-wrap:wrap;align-items:center;gap:9px 13px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}.orient select{background:#223441;color:#f2f5f9;border:1px solid var(--line);border-radius:9px;padding:8px;min-height:40px}.orient label{display:inline-flex;align-items:center;gap:5px}.orient input{width:20px;height:20px;accent-color:var(--accent)}
.joystick-col{text-align:center}.joystick{position:relative;width:min(100%,340px);aspect-ratio:1;margin:auto;border:2px solid #41695f;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;cursor:crosshair;background:repeating-radial-gradient(circle,#35594c 0px,#35594c 1px,transparent 1px,transparent 50px),linear-gradient(90deg,transparent calc(50% - .5px),#49675e 50%,transparent calc(50% + .5px)),linear-gradient(0deg,transparent calc(50% - .5px),#49675e 50%,transparent calc(50% + .5px)),radial-gradient(circle at center,#1d3a32,#10221e)}.joystick:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.stick{position:absolute;width:58px;height:58px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #d8ffdb;background:radial-gradient(circle at 32% 26%,#eaffed,var(--accent) 45%,#457d5e);pointer-events:none;box-shadow:0 7px 18px #0009}.coords{font-variant-numeric:tabular-nums;display:flex;gap:13px;justify-content:center;flex-wrap:wrap;font-weight:650;font-size:14px;margin:12px 0}.coords span,.readout{color:var(--accent)}.action-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.joystick-col .action-row{justify-content:center}.control-stack{display:grid;gap:13px;align-content:start}.formrow{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:5px;font-size:13px}.readout{font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{appearance:none;-webkit-appearance:none;display:block;background:transparent;width:100%;height:40px;margin:0;cursor:pointer;touch-action:pan-y}input[type=range]::-webkit-slider-runnable-track{height:7px;background:#405461;border-radius:10px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:25px;height:25px;background:var(--accent);border:2px solid #d2f6d7;border-radius:50%;margin-top:-9px;box-shadow:0 2px 8px #0006}input[type=range]::-moz-range-track{height:7px;background:#405461;border-radius:10px}input[type=range]::-moz-range-thumb{width:23px;height:23px;background:var(--accent);border:2px solid #d2f6d7;border-radius:50%}details{border-top:1px solid var(--line);padding-top:10px}details>summary{font-size:13px;color:var(--muted);cursor:pointer;min-height:32px;list-style-position:inside;touch-action:manipulation}details[open]>summary{margin-bottom:12px}.advanced{display:grid;gap:10px}.livebox{border:1px solid var(--line);background:#101923;padding:11px;border-radius:10px}.livebox strong{font-size:13px}.livebox .coords{margin:2px 0}.alert{color:#f6bdad;border:1px solid #754c44;background:#362622;border-radius:8px;padding:9px 12px;font-size:12px;margin-top:10px}.alert[hidden]{display:none}
.pattern-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 17px}.pattern-grid button{font-size:13px;padding:10px 4px;min-width:0}.pattern-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 18px;margin:0 0 15px}.log{background:#0b131d;border-radius:9px;border:1px solid var(--line);min-height:70px;max-height:210px;overflow:auto;white-space:pre-wrap;word-break:break-word;padding:10px;font-size:11px;line-height:1.5;font-family:ui-monospace,Consolas,monospace}
@media(max-width:720px){.appbar{padding-top:7px;padding-bottom:7px}.app-title{font-size:18px}main{padding:10px 10px calc(18px + env(safe-area-inset-bottom))}section{padding:12px;border-radius:12px;margin-bottom:9px}h2{font-size:13px;margin:0 0 11px}.layout{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:8px}.joystick{width:min(100%,260px)}.joystick-col .action-row{display:grid;grid-template-columns:1fr;gap:6px}.joystick-col .action-row button{padding:7px 2px;font-size:11px}.coords{gap:7px;font-size:12px}.control-stack{gap:8px}.formrow{font-size:12px;gap:5px}.readout{font-size:12px}.pattern-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pattern-grid button{min-height:44px;font-size:12px}.pattern-controls{gap:10px 12px}.toolbar{gap:7px}.toolbar button{padding-inline:10px;font-size:12px}.orient{gap:8px;font-size:12px}.device{grid-template-columns:minmax(0,1fr) auto}.device button{font-size:11px;min-height:40px;padding:5px 8px}}
@media(max-width:375px){.layout{grid-template-columns:1fr}.joystick{width:min(100%,250px)}.joystick-col .action-row{grid-template-columns:repeat(2,minmax(0,1fr))}.pattern-controls{grid-template-columns:1fr}.pattern-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top-right{gap:5px}.pill{font-size:11px;padding:6px}.appbar button{font-size:12px;padding:7px 9px}.device{grid-template-columns:1fr}.device button{justify-self:start}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="appbar"><div class="shell top"><h1 class="app-title">CDR01</h1><div class="top-right"><span id="status" class="pill"><span class="dot"></span><span id="status-text">未接続</span></span><button id="stop" class="danger" type="button">■ 停止</button></div></div></header>
<main class="shell">
<section class="devices-section"><h2>デバイス</h2>
<div class="toolbar"><button id="connect" class="primary" type="button">＋ 接続</button><button id="disconnect" type="button" disabled>接続解除</button><button id="diagnose" type="button" disabled>通信確認</button></div>
<div id="devices" class="device-list"></div><div id="environment" class="alert" hidden></div>
</section>
<div class="layout">
<section><h2>XY</h2><div class="joystick-col">
<div id="joystick" class="joystick" role="slider" tabindex="0" aria-label="XYジョイスティック" aria-valuetext="X 0%、Y 0%"><div id="stick" class="stick"></div></div>
<div class="coords"><div>X <span id="x-value">+0.0%</span></div><div>Y <span id="y-value">+0.0%</span></div></div>
<div class="action-row"><button id="center" type="button">XY 中央</button><button id="home" type="button">XYZ 原点</button></div>
</div></section>
<section><h2>Z</h2><div class="control-stack">
<div><div class="formrow"><label for="height">高さ</label><span class="readout" id="height-value">+0.0%</span></div><input type="range" id="height" min="-100" max="100" value="0" step="1"></div>
<details id="advanced"><summary>操作設定</summary><div class="advanced">
<div><div class="formrow"><label for="range">XY 範囲</label><span class="readout" id="range-value">100%</span></div><input type="range" id="range" min="5" max="100" value="100" step="5"></div>
<div><div class="formrow"><label for="zrange">Z 範囲</label><span class="readout" id="zrange-value">100%</span></div><input type="range" id="zrange" min="5" max="100" value="100" step="5"></div>
<div><div class="formrow"><label for="duration">補間時間</label><span class="readout" id="duration-value">180 ms</span></div><input type="range" id="duration" min="100" max="600" value="180" step="20"></div>
<div class="livebox"><div class="formrow"><strong>目標座標</strong><span id="motion-indicator" class="pill">待機</span></div><div class="coords"><div>X <span id="target-x">0.0</span></div><div>Y <span id="target-y">0.0</span></div><div>Z <span id="target-z">0.0</span></div></div></div>
</div></details>
</div></section>
</div>
<section><h2>パターン</h2>
<div class="pattern-grid" id="pattern-buttons">
<button type="button" class="selected" data-pattern="circle">円</button><button type="button" data-pattern="reverse">逆回り円</button><button type="button" data-pattern="ellipse">楕円</button><button type="button" data-pattern="eight">8の字</button><button type="button" data-pattern="x">左右</button><button type="button" data-pattern="y">前後</button><button type="button" data-pattern="z">高さ往復</button><button type="button" data-pattern="circle3d">立体円</button><button type="button" data-pattern="lissajous">リサージュ</button><button type="button" data-pattern="rose">バラ曲線</button><button type="button" data-pattern="triangle">三角形</button>
</div>
<div class="pattern-controls">
<div><div class="formrow"><label for="pattern-height">中心高さ</label><span class="readout" id="pattern-height-value">+0%</span></div><input id="pattern-height" type="range" min="-100" max="100" value="0" step="1"></div>
<div><div class="formrow"><label for="pattern-z-amplitude">上下振幅</label><span class="readout" id="pattern-z-amplitude-value">35%</span></div><input id="pattern-z-amplitude" type="range" min="0" max="100" value="35" step="5"></div>
<div><div class="formrow"><label for="pattern-size">大きさ</label><span class="readout" id="pattern-size-value">50%</span></div><input id="pattern-size" type="range" min="10" max="100" value="50" step="5"></div>
<div><div class="formrow"><label for="pattern-speed">周期</label><span class="readout" id="pattern-speed-value">4.0 秒</span></div><input id="pattern-speed" type="range" min="1.5" max="12" value="4" step="0.5"></div>
</div>
<div class="action-row"><button type="button" id="pattern-start" class="primary">▶ 開始</button><button type="button" id="pattern-stop">■ 停止</button><span id="pattern-status" class="pill">停止中</span></div>
</section>
<section><details><summary>通信ログ</summary><div id="log" class="log" role="log" aria-live="polite"></div></details></section>
</main>
<script>

(()=>{'use strict';
const SERVICE='f060699b-7f92-4e28-83a1-aaeb6d456fc4';
const CHARACTERISTIC='30e2781e-b310-469f-8f93-2542aedef202';
const $=id=>document.getElementById(id);
const devices=[]; // {device,characteristic,batteryCharacteristic,tail,version,battery,orientation}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const format=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
const settings={x:0,y:0,z:0,xy:100,zMax:100,duration:180};
let pattern='circle',playing=false,patternStart=0,patternTimer=null, dirty=false, transmitting=false,lastDispatch=0,motionEpoch=0;
let dragging=false;
const encoder=new TextEncoder(), decoder=new TextDecoder();
let logs=[];
function log(t){let line=new Date().toLocaleTimeString('ja-JP',{hour12:false})+'  '+t;logs.push(line);logs=logs.slice(-100);$('log').textContent=logs.join('\n');$('log').scrollTop=$('log').scrollHeight;}
function status(){const count=devices.filter(d=>d.device.gatt?.connected).length; $('status').classList.toggle('online',count>0);$('status-text').textContent=count?count+'台 接続中':'未接続';$('connect').disabled=count>=2||!navigator.bluetooth||!window.isSecureContext;$('disconnect').disabled=count===0;$('diagnose').disabled=count===0;$('motion-indicator').textContent=count?'操作できます':'未接続';$('motion-indicator').classList.toggle('online',count>0);}
function saveOrientation(d){try{localStorage.setItem('cdr01-orientation-'+d.device.id,JSON.stringify(d.orientation));}catch(_){}}
function loadOrientation(d){try{return {...{rotation:0,flipX:false,flipY:false,flipZ:false},...JSON.parse(localStorage.getItem('cdr01-orientation-'+d.device.id)||'{}')}}catch(_){return {rotation:0,flipX:false,flipY:false,flipZ:false}}}
function identityKey(d){return 'cdr01-identity-'+d.device.id}
function loadIdentity(d){
 try{
  const saved=JSON.parse(localStorage.getItem(identityKey(d))||'{}');
  return {alias:typeof saved.alias==='string'?saved.alias:'',address:typeof saved.address==='string'?saved.address:''};
 }catch(_){return {alias:'',address:''}}
}
function saveIdentity(d){try{localStorage.setItem(identityKey(d),JSON.stringify(d.identity))}catch(_){}}
function formatMac(value){
 const t=String(value||'').trim();
 const hex=t.replace(/[-:]/g,'');
 if(/^[0-9a-fA-F]{12}$/.test(hex))return hex.toUpperCase().match(/.{2}/g).join(':');
 return t;
}
function renderDevices(){
 let box=$('devices');box.replaceChildren();
 if(!devices.length){
  let p=document.createElement('p');p.className='minor';p.textContent='未接続';box.appendChild(p);
 }
 devices.forEach((d,index)=>{
  if(!d.identity)d.identity=loadIdentity(d);
  const node=document.createElement('div');node.className='device';
  const title=document.createElement('div');
  const strong=document.createElement('div');strong.className='device-title';
  strong.textContent=(index+1)+' · '+(d.identity.alias||d.device.name||'CDR01');
  const sub=document.createElement('div');sub.className='minor';
  sub.textContent=(d.device.gatt?.connected?'● 接続中':'○ 切断')+
   (d.version?' · '+d.version:'')+' · バッテリー '+(d.battery!=null?d.battery+'%':'未取得');
  const ident=document.createElement('div');ident.className='device-id';
  const idlabel=document.createElement('span');idlabel.textContent='識別ID';
  const idvalue=document.createElement('code');
  idvalue.textContent=d.device.id||'取得不可';
  const copy=document.createElement('button');copy.type='button';copy.className='ghost';copy.textContent='コピー';
  copy.addEventListener('click',async()=>{
   const identifier=d.device.id||'';
   try{
    if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(identifier);
    else{
     const field=document.createElement('textarea');field.value=identifier;field.style.position='fixed';
     field.style.left='-9999px';document.body.appendChild(field);field.select();
     if(!document.execCommand('copy'))throw new Error('copy failed');field.remove();
    }
    copy.textContent='コピー済み';
   }catch(_){log('識別IDのコピーに失敗しました')}
  });
  ident.append(idlabel,idvalue,copy);title.append(strong,sub,ident);
  const btn=document.createElement('button');btn.type='button';btn.className='ghost';
  btn.textContent='切断';btn.addEventListener('click',()=>disconnectOne(d));
  node.append(title,btn);

  const idinputs=document.createElement('div');idinputs.className='device-identity';
  for(const [key,label,placeholder] of [
   ['alias','識別名','左 / 右'],
   ['address','Bluetoothアドレス (手入力)','AA:BB:CC:DD:EE:FF']
  ]){
   const wrap=document.createElement('label');wrap.textContent=label;
   const field=document.createElement('input');field.type='text';field.value=d.identity[key]||'';
   field.placeholder=placeholder;field.autocomplete='off';field.spellcheck=false;
   field.addEventListener('change',()=>{
    d.identity[key]=key==='address'?formatMac(field.value):field.value.trim();
    saveIdentity(d);renderDevices();
   });
   wrap.appendChild(field);idinputs.appendChild(wrap);
  }
  node.appendChild(idinputs);
  const o=document.createElement('div');o.className='orient';
  const lbl=document.createElement('span');lbl.textContent='向き設定';o.append(lbl);
  const sel=document.createElement('select');
  [0,90,180,270].forEach(a=>{
   const opt=document.createElement('option');opt.value=a;opt.textContent='XY '+a+'°';sel.append(opt);
  });
  sel.value=String(d.orientation.rotation);
  sel.addEventListener('change',()=>{
   d.orientation.rotation=Number(sel.value);saveOrientation(d);
   log('向き設定を変更: '+(d.identity.alias||d.device.name)+' / '+sel.value+'°');
  });o.append(sel);
  for(const [prop,label] of [['flipX','X反転'],['flipY','Y反転'],['flipZ','Z反転']]){
   const labelNode=document.createElement('label'),check=document.createElement('input');
   check.type='checkbox';check.checked=d.orientation[prop];
   check.addEventListener('change',()=>{d.orientation[prop]=check.checked;saveOrientation(d)});
   labelNode.append(check,document.createTextNode(label));o.append(labelNode);
  }
  node.append(o);box.append(node);
 });
 status();
}
function rx(d,view){if(!view)return;let s=decoder.decode(new Uint8Array(view.buffer,view.byteOffset,view.byteLength)).trim();if(!s)return;log('← '+(d.device.name||'CDR01')+' '+s);if(/^VALUE version /i.test(s)){d.version=s.replace(/^VALUE version /i,'');renderDevices()}if(/^VALUE battery /i.test(s)){let m=s.match(/\blevel=(\d+)/);if(m){d.battery=Number(m[1]);renderDevices()}}if(/^ERR\s/i.test(s)){log('警告: CDR01がコマンドを拒否しました');}}
async function connect(){if(devices.filter(d=>d.device.gatt?.connected).length>=2)return;if(!navigator.bluetooth||!isSecureContext){environmentWarning();return}
 let device;try{device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'CDR01'}],optionalServices:[SERVICE,'battery_service']});}catch(e){if(e.name!=='NotFoundError')log('機器選択: '+e.message);return}if(devices.some(d=>d.device.id===device.id)){log('同じ機器は既に登録済みです。');return}
 $('connect').disabled=true;log('接続を開始: '+(device.name||'CDR01'));
 try{let server=await device.gatt.connect();let service=await server.getPrimaryService(SERVICE);let characteristic=await service.getCharacteristic(CHARACTERISTIC);
  let d={device,characteristic,batteryCharacteristic:null,version:'',battery:null,tail:Promise.resolve(),orientation:null};d.orientation=loadOrientation(d);
  await characteristic.startNotifications();characteristic.addEventListener('characteristicvaluechanged',e=>rx(d,e.target.value));
  device.addEventListener('gattserverdisconnected',()=>onDisconnected(d));
  try{const bs=await server.getPrimaryService('battery_service');const b=await bs.getCharacteristic('battery_level');d.batteryCharacteristic=b;let v=await b.readValue();d.battery=v.getUint8(0);await b.startNotifications();b.addEventListener('characteristicvaluechanged',e=>{d.battery=e.target.value.getUint8(0);renderDevices()})}catch(e){log('Battery Service: '+e.message)}
  devices.push(d);dirty=false;renderDevices();log('接続完了: '+(device.name||'CDR01'));
  await Promise.allSettled([enqueue(d,'VERSION'),enqueue(d,'BATTERY')]);
 }catch(e){log('接続失敗: '+e.message);try{device.gatt?.disconnect()}catch(_){}}
 finally{status()}}
function onDisconnected(d){motionEpoch++;stopPatternLocal();dirty=false;devices.splice(devices.indexOf(d),devices.includes(d)?1:0);log('Bluetooth切断: '+(d.device.name||'CDR01')+'。本体の動作を確認してください。');renderDevices()}
async function disconnectOne(d){stopPatternLocal();motionEpoch++;dirty=false;try{await sendStop(d)}catch(e){log('停止送信失敗: '+e.message)}try{d.device.gatt?.disconnect()}catch(_){ }if(devices.includes(d)){devices.splice(devices.indexOf(d),1);renderDevices()}}
async function disconnectAll(){stopPatternLocal();motionEpoch++;dirty=false;await Promise.allSettled([...devices].map(d=>sendStop(d)));for(const d of [...devices]){try{d.device.gatt?.disconnect()}catch(_){}}devices.splice(0);renderDevices()}
function enqueue(d,command){d.tail=d.tail.catch(()=>{}).then(async()=>{if(!d.device.gatt?.connected)throw Error('切断されました');const bytes=encoder.encode(command+'\n');if(typeof d.characteristic.writeValueWithResponse==='function')await d.characteristic.writeValueWithResponse(bytes);else await d.characteristic.writeValue(bytes);});return d.tail.catch(e=>{log('送信失敗 '+(d.device.name||'CDR01')+': '+e.message);throw e})}
function transform(d,x,y,z){const o=d.orientation;let px=o.flipX?-x:x,py=o.flipY?-y:y;let r=o.rotation*Math.PI/180;let xx=px*Math.cos(r)-py*Math.sin(r), yy=px*Math.sin(r)+py*Math.cos(r);return [xx,yy,o.flipZ?-z:z]}
function stopPatternLocal(){if(patternTimer!==null){clearInterval(patternTimer);patternTimer=null}playing=false;$('pattern-status').textContent='停止中';$('pattern-start').disabled=false}
function patternCoords(which,t){
 const amp=Number($('pattern-size').value)/100;
 const za=Number($('pattern-z-amplitude').value)/100;
 let x=0,y=0,dz=0;
 switch(which){
  case 'circle':x=Math.cos(t)*amp;y=Math.sin(t)*amp;break;
  case 'reverse':x=Math.cos(t)*amp;y=-Math.sin(t)*amp;break;
  case 'ellipse':x=Math.cos(t)*amp;y=.55*Math.sin(t)*amp;break;
  case 'eight':x=Math.sin(t)*amp;y=.5*Math.sin(2*t)*amp;break;
  case 'x':x=Math.sin(t)*amp;break;
  case 'y':y=Math.sin(t)*amp;break;
  case 'z':dz=Math.sin(t)*amp*za;break;
  // これらは公開CDR Scripter文書に記載された動作形式をブラウザー側で生成したもの。
  // 開発元のREMOTEサイトと同じ実装・パラメータ仕様を保証するものではない。
  case 'circle3d':x=Math.cos(t)*amp;y=Math.sin(t)*amp/Math.SQRT2;dz=Math.sin(t)*amp*za/Math.SQRT2;break;
  case 'lissajous':x=Math.sin(3*t)*amp;y=Math.sin(2*t+Math.PI/2)*amp;break;
  case 'rose':{let r=Math.cos(3*t)*amp;x=r*Math.cos(t);y=r*Math.sin(t);break;}
  case 'triangle':{
   const p=(t/(2*Math.PI)*3)%3;
   const i=Math.floor(p),f=p-i;
   const verts=[[1,0],[-.5,Math.sqrt(3)/2],[-.5,-Math.sqrt(3)/2]];
   x=(verts[i][0]*(1-f)+verts[(i+1)%3][0]*f)*amp;
   y=(verts[i][1]*(1-f)+verts[(i+1)%3][1]*f)*amp;
   break;
  }
 }
 const h=Number($('pattern-height').value)/100;
 const z=clamp(h+dz,-1,1);
 return [clamp(x,-1,1),clamp(y,-1,1),z];
}
function applyPatternFrame(){
 const period=Number($('pattern-speed').value)*1000;
 const t=(performance.now()-patternStart)/period*2*Math.PI;
 [settings.x,settings.y,settings.z]=patternCoords(pattern,t);
 updateControls();markMotion();
}
function beginPattern(){if(!devices.some(d=>d.device.gatt?.connected)){log('パターン開始にはBluetooth接続が必要です');return}stopPatternLocal();patternStart=performance.now();playing=true;$('pattern-status').textContent='連続再生中';$('pattern-start').disabled=true;log('パターン開始: '+pattern);applyPatternFrame();patternTimer=setInterval(applyPatternFrame,70)}
async function stopAll(){motionEpoch++;stopPatternLocal();dirty=false;let ds=devices.filter(d=>d.device.gatt?.connected);$('pattern-status').textContent='停止中';log('■ STOPを送信');await Promise.allSettled(ds.map(d=>sendStop(d)));}
async function sendStop(d){try{await enqueue(d,'STOP')}catch(_){}try{await enqueue(d,'VIBRATE 0')}catch(_){}}
function target(){return [settings.x*settings.xy,settings.y*settings.xy,settings.z*settings.zMax]}
function updateControls(){let [x,y,z]=target();$('x-value').textContent=format(x);$('y-value').textContent=format(y);$('height-value').textContent=format(z);$('target-x').textContent=x.toFixed(1);$('target-y').textContent=y.toFixed(1);$('target-z').textContent=z.toFixed(1);$('stick').style.left=(50+settings.x*42)+'%';$('stick').style.top=(50-settings.y*42)+'%';$('joystick').setAttribute('aria-valuetext','X '+format(x)+'、Y '+format(y));$('height').value=Math.round(settings.z*100);}
function markMotion(){dirty=true;}
async function motionTick(){if(transmitting||!dirty||!devices.some(d=>d.device.gatt?.connected))return;const now=performance.now();if(now-lastDispatch<75)return;lastDispatch=now;dirty=false;let currentEpoch=motionEpoch;let [x,y,z]=target();transmitting=true;
 try{let connected=devices.filter(d=>d.device.gatt?.connected);await Promise.allSettled(connected.map(d=>{if(currentEpoch!==motionEpoch)return Promise.resolve();let [ax,ay,az]=transform(d,x,y,z);let cmd=`LINE ${ax.toFixed(3)} ${ay.toFixed(3)} ${az.toFixed(3)} ${settings.duration}`;return enqueue(d,cmd)}))}finally{transmitting=false}}
// Tick has at most one outstanding batch of BLE writes, and always sends the latest target.
setInterval(motionTick,30);
function manual(){if(playing)stopPatternLocal();updateControls();markMotion()}
function setXY(e){const r=$('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/(r.width*.42),y=(cy-e.clientY)/(r.height*.42);let len=Math.hypot(x,y);if(len>1){x/=len;y/=len}settings.x=clamp(x,-1,1);settings.y=clamp(y,-1,1);manual()}
$('joystick').addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;dragging=true;$('joystick').setPointerCapture?.(e.pointerId);setXY(e)});
$('joystick').addEventListener('pointermove',e=>{if(dragging)setXY(e)});
for(let evt of ['pointerup','pointercancel','lostpointercapture'])$('joystick').addEventListener(evt,()=>{dragging=false});
$('joystick').addEventListener('keydown',e=>{let n=e.shiftKey?.05:.02;switch(e.key){case'ArrowLeft':settings.x-=n;break;case'ArrowRight':settings.x+=n;break;case'ArrowUp':settings.y+=n;break;case'ArrowDown':settings.y-=n;break;default:return}e.preventDefault();settings.x=clamp(settings.x,-1,1);settings.y=clamp(settings.y,-1,1);let len=Math.hypot(settings.x,settings.y);if(len>1){settings.x/=len;settings.y/=len}manual()});
$('height').addEventListener('input',e=>{const h=Number(e.target.value)/100;$('pattern-height').value=Math.round(h*100);$('pattern-height-value').textContent=format(h*100);if(playing)applyPatternFrame();else{settings.z=h;manual()}});
$('range').addEventListener('input',e=>{settings.xy=Number(e.target.value);$('range-value').textContent=settings.xy+'%';updateControls();markMotion()});
$('zrange').addEventListener('input',e=>{settings.zMax=Number(e.target.value);$('zrange-value').textContent=settings.zMax+'%';updateControls();markMotion()});
$('duration').addEventListener('input',e=>{settings.duration=Number(e.target.value);$('duration-value').textContent=settings.duration+' ms'});
$('center').addEventListener('click',()=>{settings.x=settings.y=0;manual()});$('home').addEventListener('click',()=>{settings.x=settings.y=settings.z=0;manual()});
$('stop').addEventListener('click',stopAll);$('connect').addEventListener('click',connect);$('disconnect').addEventListener('click',disconnectAll);
$('diagnose').addEventListener('click',async()=>{await Promise.allSettled(devices.map(d=>Promise.allSettled([enqueue(d,'VERSION'),enqueue(d,'BATTERY')])))});
$('pattern-buttons').addEventListener('click',e=>{let b=e.target.closest('[data-pattern]');if(!b)return;pattern=b.dataset.pattern;document.querySelectorAll('[data-pattern]').forEach(n=>n.classList.toggle('selected',n===b));if(playing)patternStart=performance.now()});
$('pattern-height').addEventListener('input',e=>{$('pattern-height-value').textContent=format(Number(e.target.value));if(playing)applyPatternFrame();});$('pattern-z-amplitude').addEventListener('input',e=>{$('pattern-z-amplitude-value').textContent=e.target.value+'%';if(playing)applyPatternFrame();});$('pattern-size').addEventListener('input',e=>{$('pattern-size-value').textContent=e.target.value+'%';if(playing)applyPatternFrame()});$('pattern-speed').addEventListener('input',e=>{$('pattern-speed-value').textContent=Number(e.target.value).toFixed(1)+' 秒'});$('pattern-start').addEventListener('click',beginPattern);$('pattern-stop').addEventListener('click',async()=>{if(playing){await stopAll()}else{stopPatternLocal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();stopAll()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&devices.some(d=>d.device.gatt?.connected)){stopAll();log('画面が非表示になったため操作を停止しました')}});
window.addEventListener('pagehide',()=>{motionEpoch++;stopPatternLocal();dirty=false;for(const d of devices){if(d.device.gatt?.connected){enqueue(d,'STOP').catch(()=>{});enqueue(d,'VIBRATE 0').catch(()=>{})}}});
function environmentWarning(){let problems=[];if(!isSecureContext)problems.push('HTTPS環境が必要です');if(!navigator.bluetooth)problems.push('このブラウザはBluetooth非対応です');if(problems.length){$('environment').hidden=false;$('environment').textContent=problems.join(' ');log(problems.join(' '))}}
updateControls();status();environmentWarning();
})();

</script>
</body>
